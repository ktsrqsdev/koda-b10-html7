<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>kalkulator</title>
    </head>

    <body>
        <div class="calculator">
            <div id="display">0</div>
            <button class="mr">MR</button>
            <button class="mplus">&plus; M</button>
            <button class="mminus">&minus; M</button>
            <button class="del">DEL</button>
            <button class="ac">AC</button>
            <button class="ce">CE</button>
            <button class="percent">&percnt;</button>
            <button class="op">÷</button>
            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
            <button class="op">×</button>
            <button class="num">4</button>
            <button class="num">5</button>
            <button class="num">6</button>
            <button class="op">-</button>
            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
            <button class="op">+</button>
            <button class="sign">&plus;/&minus;</button>
            <button class="num">0</button>
            <button class="num">&CenterDot;</button>
            <button class="equals">&equals;</button>
        </div>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script src="script.js"></script>
    </body>

</html>
